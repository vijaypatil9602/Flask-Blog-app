{% extends "base.html" %}
{% block content %}
  <!-- 
    This page is now 100% styled by the .post class 
    in style.css file.
  -->
  <article class="post">
    <h2>{{ post.title }}</h2>
    <div class="post-meta">
        By {{ post.author.name }} on {{ post.date_posted.strftime('%Y-%m-%d') }}
    </div>

    <!-- "class" now has two 's's -->
    <p class="post-content">{{ post.content | safe }}</p>

    <!-- Show Update/Delete buttons only if user is the author -->
    {% if post.author == current_user %}
      <div class="post-controls">
        <a href="{{ url_for('crud.update_post', post_id=post.id) }}" class="btn btn-secondary">Update</a>
        
        <!-- Delete button (uses a simple form to send a POST request) -->
        <form action="{{ url_for('crud.delete_post', post_id=post.id) }}" method="POST">
            <input type="submit" value="Delete" class="btn btn-danger" onclick="return confirm('Are you sure you want to delete this post?')">
        </form>
      </div>
    {% endif %}
  </article>
{% endblock content %}
